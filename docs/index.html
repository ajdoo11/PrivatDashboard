<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com wss://*.firebaseio.com https://*.firebaseio.com; frame-src 'self' blob: https://mein-pdf-plan-manager.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<title>Unser Zuhause</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f5f6fb;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#eceef3;--soft:#f3f4f8;--soft2:#e9ebf2;
  --primary:#6d4aff;--onprimary:#fff;--danger:#ef4444;--ok:#10b981;--warn:#f59e0b;
  --cal:#4f7cff;--fin:#10b981;--shop:#f59e0b;--house:#8b5cf6;--safe:#0ea5a4;--fam:#ec4899;
  --g-primary:linear-gradient(135deg,#6d4aff 0%,#a855f7 55%,#ec4899 100%);
  --g-cal:linear-gradient(135deg,#4f7cff,#7c5cff);
  --g-fin:linear-gradient(135deg,#10b981,#14b8a6);
  --g-shop:linear-gradient(135deg,#fbbf24,#f97316);
  --g-house:linear-gradient(135deg,#8b5cf6,#c026d3);
  --g-safe:linear-gradient(135deg,#14b8a6,#0284c7);
  --g-fam:linear-gradient(135deg,#ec4899,#f43f5e);
  --radius:22px;--shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px -12px rgba(17,24,39,.12);
  --glass:rgba(255,255,255,.78);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d14;--card:#151824;--text:#eef0f6;--muted:#9aa1b5;--line:#232737;--soft:#1b1f2e;--soft2:#252a3c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.6);--glass:rgba(21,24,36,.78);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d14;--card:#151824;--text:#eef0f6;--muted:#9aa1b5;--line:#232737;--soft:#1b1f2e;--soft2:#252a3c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.6);--glass:rgba(21,24,36,.78);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(104px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:340px;z-index:-1;pointer-events:none;background:radial-gradient(60% 60% at 15% 0%,color-mix(in srgb,var(--accent-bg,#6d4aff) 16%,transparent),transparent 70%),radial-gradient(50% 50% at 95% 10%,color-mix(in srgb,#ec4899 10%,transparent),transparent 70%)}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:750;letter-spacing:-.01em}
.ic{flex:none;display:block}
.muted{color:var(--muted)}.small{font-size:13px}
.sp{flex:1}
.wrap{max-width:820px;margin:0 auto;padding:4px 16px 24px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);max-width:820px;margin:0 auto}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad);box-shadow:0 8px 18px -8px var(--accent);flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 12px;max-width:820px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:999px;background:var(--card);white-space:nowrap;font-size:14px;font-weight:700;color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
.tab.on{background:var(--grad,var(--accent));color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
/* Karten */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.card.flat{box-shadow:none;background:var(--soft)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{flex:1}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;background:var(--soft2);font-weight:700;font-size:14px;white-space:nowrap;transition:transform .08s}
.btn:active,.icon-btn:active,.tile:active,.qbtn:active{transform:scale(.97)}
.btn.pri{background:var(--grad,var(--accent));color:#fff;box-shadow:0 8px 20px -10px var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%;padding:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:14px;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;flex:none}
.icon-btn.pri{background:var(--grad,var(--accent));color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.icon-btn.sm{width:34px;height:34px;border-radius:11px;background:transparent;box-shadow:none;color:var(--muted)}
.icon-btn.ghost{background:transparent;box-shadow:none}
/* Zeilen */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:52px}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.clickable{cursor:pointer}
.t{font-weight:650;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12.5px;color:var(--muted);margin-top:1px}
.strike{text-decoration:line-through;color:var(--muted);font-weight:500}
.amt{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.pos{color:var(--ok)}.amt.neg{color:var(--danger)}.amt.sm{font-size:13px;font-weight:650;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft2);color:var(--muted);vertical-align:middle;border:0;white-space:nowrap}
.badge.fin{background:color-mix(in srgb,var(--fin) 15%,transparent);color:var(--fin)}
.badge.shop{background:color-mix(in srgb,var(--shop) 18%,transparent);color:#d97706}
.badge.safe{background:color-mix(in srgb,var(--safe) 15%,transparent);color:var(--safe)}
.badge.house{background:color-mix(in srgb,var(--house) 15%,transparent);color:var(--house)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:#d97706}
.badge.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--soft2);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;color:#fff;transition:.15s}
.chk.on{background:var(--grad,var(--ok));border-color:transparent}
.bullet{width:10px;height:10px;border-radius:50%;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 2px var(--card)}
.avbtn{border:0;background:none;padding:0}
.empty{color:var(--muted);text-align:center;padding:16px 4px;margin:0;font-size:14px}
.hint{font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--accent,var(--primary)) 7%,var(--card));border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.hint .ic{color:var(--accent,var(--primary));margin-top:1px}
.bar{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--grad,var(--accent));border-radius:99px}
.bar>i.b2{background:color-mix(in srgb,var(--accent) 40%,transparent);border-radius:0 99px 99px 0}
.bar.lg{height:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px}
.stat .l{font-size:12px;color:var(--muted);font-weight:650}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mnav b{font-size:16px;font-weight:800;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;padding:7px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;box-shadow:0 0 0 1px var(--line) inset}
.chip.on{background:var(--grad,var(--accent));color:#fff;box-shadow:none}
.chip small{opacity:.75;margin-left:4px}
/* Navigation unten */
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:var(--glass);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:26px;box-shadow:0 14px 40px -12px rgba(17,24,39,.3);max-width:620px;margin:0 auto}
#nav .in{display:grid;grid-template-columns:repeat(6,1fr);padding:6px}
#nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:18px}
#nav a .ni{width:44px;height:28px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:.15s}
#nav a.on{color:var(--c)}
#nav a.on .ni{background:color-mix(in srgb,var(--c) 16%,transparent)}
/* Home */
.hero{position:relative;margin:0 auto;max-width:820px;padding:calc(18px + env(safe-area-inset-top)) 16px 0}
.hero-card{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:var(--g-primary);box-shadow:0 20px 40px -18px rgba(109,74,255,.6)}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-card::before{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;border-radius:20px;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 8px 18px -6px rgba(0,0,0,.35);flex:none;background:rgba(255,255,255,.2)}
.hero .hd{font-size:13px;opacity:.85;font-weight:600}
.hero h1{font-size:24px;color:#fff}
.hero .av{box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.hero-chips{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-chips a{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:138px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,var(--card)) 0%,var(--card) 75%);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--c) 14%,var(--line));transition:transform .1s}
.tile .ti{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--g);box-shadow:0 10px 20px -10px var(--c);margin-bottom:6px}
.tile b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.tile .s{font-size:12.5px;line-height:1.35}
.tile .arr{position:absolute;right:14px;top:16px;color:color-mix(in srgb,var(--c) 70%,var(--muted));opacity:.7}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:0 14px;box-shadow:var(--shadow);margin:14px 0;color:var(--muted);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.search input{border:0;background:transparent;padding:13px 0;font-size:16px;color:var(--text);flex:1;outline:none;min-width:0;box-shadow:none}
.fab{position:fixed;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--g-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 28px -10px rgba(109,74,255,.7);z-index:25}
@media(min-width:860px){.fab{right:calc(50% - 390px)}}
.alert{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .aic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.alert.warn .aic{background:color-mix(in srgb,var(--warn) 15%,transparent);color:#d97706}
.alert.danger .aic{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.alert.info .aic{background:var(--soft2);color:var(--muted)}
.dayh{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.dayh:first-child{margin-top:0}
.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qbtn{border:0;background:var(--soft);border-radius:20px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px}
.qbtn .ti{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--g);box-shadow:0 10px 18px -10px var(--c)}
/* Termine */
.ev{display:flex;gap:12px;align-items:center;padding:11px 12px 11px 14px;border-radius:16px;background:color-mix(in srgb,var(--ec) 9%,var(--card));margin-bottom:8px;position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ec)}
.ev .evt{width:46px;flex:none;display:flex;flex-direction:column;line-height:1.15}
.ev .evt b{font-size:14px;font-weight:800}
.ev .evt small{font-size:11.5px;color:var(--muted);font-weight:600}
.ev .evi{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ec) 18%,transparent);color:var(--ec);flex:none}
.ev .chk{border-color:color-mix(in srgb,var(--ec) 45%,transparent)}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cal .d{border:0;background:var(--soft);border-radius:12px;min-height:70px;padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;overflow:hidden;min-width:0;transition:background .12s}
@media(min-width:640px){.cal .d{min-height:100px;padding:6px 5px}}
.cal .d .n{font-size:12.5px;font-weight:800;width:23px;height:23px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:1px}
.cal .d.out{opacity:.38}
.cal .d.today .n{background:var(--grad);color:#fff}
.cal .d.sel{background:color-mix(in srgb,var(--accent) 12%,var(--card));box-shadow:inset 0 0 0 2px var(--accent)}
.evc{display:block;font-size:9.5px;line-height:1.3;font-weight:700;padding:1px 3px 1px 4px;border-radius:5px;border-left:3px solid var(--ec);background:color-mix(in srgb,var(--ec) 22%,transparent);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:clip}
@media(min-width:640px){.evc{font-size:11px;padding:2px 6px;text-overflow:ellipsis}}
.more{font-size:9.5px;color:var(--muted);font-weight:800;padding-left:3px}
.legend2{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:12px;height:4px;border-radius:2px;display:block}
/* Finanzen */
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sech:first-child{margin-top:0}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .axl{font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cbar{margin:10px 0}
.cl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;gap:8px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--muted);font-weight:700;font-size:12px}
.catic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--soft);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.seg button.on.out{color:var(--danger)}.seg button.on.in{color:var(--ok)}
.amtin{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:18px;padding:6px 16px;margin-bottom:10px}
.amtin span{font-weight:800;color:var(--muted);font-size:18px}
.amtin input{border:0;background:transparent;font-size:32px;font-weight:800;padding:6px 0;letter-spacing:-.02em;box-shadow:none}
.catchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 12px;padding-bottom:2px}
.catchips::-webkit-scrollbar{display:none}
.catchip{border:0;white-space:nowrap;padding:8px 12px;border-radius:14px;background:var(--soft);font-weight:700;font-size:13px;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.catchip.on{background:color-mix(in srgb,var(--accent) 15%,var(--card));box-shadow:inset 0 0 0 2px var(--accent)}
.addrow{display:flex;gap:8px;padding:10px 0 2px}
/* Einkauf */
.qadd{display:flex;gap:8px;margin-bottom:6px}
.qadd input{flex:1;min-width:0}
.qadd input.w90{flex:0 0 86px}
.daycol{width:46px;flex:none;display:flex;flex-direction:column;line-height:1.15}
.daycol small{color:var(--muted);font-size:11.5px}
.daycol.today b{color:var(--accent)}
/* Haus */
.timeline{position:relative;padding-left:4px}
.ms{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.ms .dotc{width:26px;display:flex;flex-direction:column;align-items:center;flex:none;align-self:stretch}
.ms .dotc .chk{width:24px;height:24px;border-radius:50%}
.ms .dotc .ln{flex:1;width:2px;background:var(--line);margin-top:4px}
.ms:last-child .ln{display:none}
.offer{padding:12px;border-radius:18px;background:var(--soft);margin-bottom:10px}
.offer.chosen{background:color-mix(in srgb,var(--house) 10%,var(--card));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--house) 50%,transparent)}
.offer .top2{display:flex;gap:10px;align-items:flex-start}
/* Dateien */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ftile{border:0;padding:0;background:var(--soft);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.ftile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft2)}
.ftile .fic{width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.ftile .fic small{font-weight:800;font-size:11px;text-transform:uppercase}
.ftile .fname{font-size:11.5px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.strip .ftile{width:54px}
.strip .ftile .fname{display:none}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:0;padding:6px 10px;border-radius:12px;background:var(--card);font-size:12.5px;font-weight:700;max-width:100%;box-shadow:0 0 0 1px var(--line) inset}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.fchip img{width:22px;height:22px;border-radius:6px;object-fit:cover}
.fchip.add{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent);border:0}
.fchip .x{border:0;background:none;padding:0 0 0 2px;color:var(--muted);display:flex}
.attach{border:1.5px dashed var(--soft2);border-radius:16px;padding:12px}
.attach .l{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.filebtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:750;font-size:13.5px;cursor:pointer}
.fsel{font-size:12.5px;color:var(--muted);margin-top:6px}
.f .attach .filebtn{display:inline-flex;color:var(--accent);font-size:13.5px}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--soft2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.preview{background:var(--soft);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:120px;margin-bottom:10px}
.preview img{max-width:100%;max-height:62vh;display:block}
.preview iframe{width:100%;height:62vh;border:0;background:#fff}
.lock{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lockic{width:80px;height:80px;border-radius:28px;background:var(--g-safe);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 30px -12px var(--safe)}
.lockf{display:flex;gap:8px;margin-top:8px;width:100%;max-width:300px}
.lockf input{flex:1;text-align:center;letter-spacing:.3em;font-size:20px}
/* Modal & Formulare */
#modal{display:none}
#modal.open{display:block}
.mbg{position:fixed;inset:0;background:rgba(10,12,20,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1);--accent:var(--maccent,var(--primary));--grad:var(--mgrad,var(--g-primary))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--soft2);margin:0 auto 12px}
@media(min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:28px;animation:fade .15s;padding-top:18px}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mh h3{flex:1;font-size:19px;font-weight:800}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f>*{grid-column:span 2}
.f>.half{grid-column:span 1}
.f label{display:grid;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;padding:11px 13px;border:0;border-radius:14px;background:var(--soft);color:var(--text);width:100%;outline:none;min-width:0;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 0 0 2px var(--accent,var(--primary));background:var(--card)}
input.err{box-shadow:inset 0 0 0 2px var(--danger)}
textarea{resize:vertical}
.f label.chkline{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);font-weight:600;padding:6px 0}
.chkline input{width:22px;height:22px;flex:none;accent-color:var(--accent,var(--primary));box-shadow:none}
.mf{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.f .mf{grid-column:span 2}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sres{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sres:last-child{border-bottom:0}
.sres .ti{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.gridbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
/* Anmeldung */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));margin-bottom:-104px}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:28px 22px;box-shadow:var(--shadow);text-align:center;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.auth-logo{width:84px;height:84px;border-radius:28px;object-fit:cover;box-shadow:0 14px 30px -12px rgba(109,74,255,.6);margin-bottom:12px}
.auth h1{font-size:24px;margin-bottom:6px;background:var(--g-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth p{margin:6px 0 14px}
.f1{display:grid;gap:10px;margin:8px 0 6px;text-align:left}
.f1 .btn{margin-top:4px}
.aerr{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;text-align:left}
.ainfo{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;text-align:left}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:700;font-size:14px;padding:10px;margin-top:4px}
.auth-foot{margin-top:16px;display:flex;align-items:center;gap:6px}
.btn:disabled{opacity:.6}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="filepick" multiple hidden>
<noscript>Diese App benötigt JavaScript.</noscript>
<script type="module" src="fb.js"></script>
<script src="app.js" defer></script>
</body>
</html>
